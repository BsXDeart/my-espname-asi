name: Build ESP ASI

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile C++ to ESPName.asi
      run: |
        cl /LD /O2 /EHsc main.cpp User32.lib /link /OUT:ESPName.asi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESPName-ASI
        path: ESPName.asi
